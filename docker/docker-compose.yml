# PaperFactory - Core services
# Start: docker-compose up -d

version: "3.8"

services:
  # ============================================================
  # PostgreSQL
  # ============================================================
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paperfactory
      POSTGRES_USER: paperfactory
      POSTGRES_PASSWORD: paperfactory_dev
    ports:
      - "5434:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperfactory"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================
  # Database Migration (runs once, then exits)
  # ============================================================
  migrate:
    build:
      context: ../ts
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ../ts:/app
      - ts_node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgresql://paperfactory:paperfactory_dev@postgres:5432/paperfactory
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx tsx src/persistence/migrate.ts"

  # ============================================================
  # TypeScript App
  # ============================================================
  ts-app:
    build:
      context: ../ts
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ../ts:/app
      - ts_node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgresql://paperfactory:paperfactory_dev@postgres:5432/paperfactory
      LLM_BASE_URL: http://host.docker.internal:8011/v1
      SCIENCE_SERVICE_URL: http://science-service:8001
      PORT: "3001"
    ports:
      - "3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_started
    command: sh -c "pnpm install --prefer-offline 2>/dev/null && npx tsx src/app/cli.ts run"
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:3001/health > /dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ============================================================
  # Science Service (Python microservice)
  # ============================================================
  science-service:
    build:
      context: ../science-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pg_data:
  ts_node_modules:
