name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.11'
  PNPM_VERSION: '10.4.1'

jobs:
  # ============================================================
  # 1. Python Lint + Type Check
  # ============================================================
  python-lint:
    name: Python Lint & Type
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Ruff lint
        run: uv run ruff check packages/ tests/

      - name: Ruff format check
        run: uv run ruff format --check packages/ tests/

      - name: Pyright type check
        run: uv run pyright packages/ tests/

  # ============================================================
  # 2. Python Tests
  # ============================================================
  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: python-lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run tests with coverage
        run: uv run pytest tests/ --cov=packages --cov-report=term-missing --cov-report=xml --cov-report=html
        env:
          PYTHONDONTWRITEBYTECODE: '1'

      - name: Upload coverage to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: |
            coverage.xml
            htmlcov/
          retention-days: 7

      - name: Coverage threshold check
        run: |
          uv run pytest tests/ --cov=packages --cov-report=term --cov-fail-under=80

  # ============================================================
  # 3. TypeScript Lint + Type Check
  # ============================================================
  ts-lint:
    name: TypeScript Lint & Type
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ts
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ./ts/pnpm-lock.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: ESLint
        run: pnpm lint

      - name: TypeScript type check
        run: pnpm typecheck

  # ============================================================
  # 4. TypeScript Tests
  # ============================================================
  ts-test:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    needs: ts-lint
    defaults:
      run:
        working-directory: ./ts
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ./ts/pnpm-lock.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: ts-coverage
          path: |
            ts/coverage/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ts-test-results
          path: ts/coverage/coverage-final.json
          retention-days: 7

  # ============================================================
  # 5. Architecture Tests (Python - cross-cutting)
  # ============================================================
  architecture-tests:
    name: Architecture Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run architecture tests
        run: uv run pytest tests/architecture/ -v

  # ============================================================
  # 6. Docker Build Test
  # ============================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [python-test, ts-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Python service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.python
          push: false
          load: true
          tags: paperfactory-python:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build TypeScript service
        uses: docker/build-push-action@v6
        with:
          context: ./ts
          file: ./ts/Dockerfile
          push: false
          load: true
          tags: paperfactory-ts:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test Python container
        run: |
          docker run --rm paperfactory-python:test uv run pytest tests/ -q

      - name: Smoke test TS container
        run: |
          docker run --rm paperfactory-ts:test pnpm test

  # ============================================================
  # 7. Docker Publish (only on tagged releases)
  # ============================================================
  docker-publish:
    name: Docker Publish
    runs-on: ubuntu-latest
    needs: docker-build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_REGISTRY }}/paperfactory
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Summary job
  # ============================================================
  ci-summary:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [python-test, ts-test, architecture-tests]
    if: always()
    steps:
      - name: Check results
        run: |
          python_result="${{ needs.python-test.result }}"
          ts_result="${{ needs.ts-test.result }}"
          arch_result="${{ needs.architecture-tests.result }}"
          echo "Python: $python_result"
          echo "TypeScript: $ts_result"
          echo "Architecture: $arch_result"
          [[ "$python_result" == "success" ]] || exit 1
          [[ "$ts_result" == "success" || "$ts_result" == "skipped" ]] || exit 1
          [[ "$arch_result" == "success" ]] || exit 1
