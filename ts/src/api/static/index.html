<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PaperFactory Agent</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0c10;--s1:#12151c;--s2:#1a1e28;--s3:#242836;--border:#2e3348;--t1:#e2e6ef;--t2:#6b7280;--accent:#7c5cfc;--green:#10b981;--red:#ef4444;--yellow:#f59e0b;--blue:#3b82f6;--purple:#8b5cf6;--cyan:#06b6d4;--orange:#f97316}
body{font-family:'JetBrains Mono','SF Mono',Consolas,monospace;background:var(--bg);color:var(--t1);height:100vh;display:flex;flex-direction:column;overflow:hidden}
#topbar{height:44px;background:var(--s1);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0}
#topbar h1{font-size:.85rem;font-weight:700;color:var(--accent)}
#topbar .nav{display:flex;gap:4px;margin-left:24px}
#topbar .nav button{background:none;border:none;color:var(--t2);font-size:.75rem;padding:6px 12px;border-radius:4px;cursor:pointer;font-family:inherit}
#topbar .nav button.active{color:var(--t1);background:var(--s3)}
#topbar .nav button:hover{color:var(--t1)}
#topbar .status{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:.7rem;color:var(--t2)}
#topbar .dot{width:7px;height:7px;border-radius:50%;background:var(--t2)}
#topbar .dot.running{background:var(--green);animation:pulse 1s infinite}
#topbar .dot.error{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
#main{flex:1;display:flex;overflow:hidden}
/* Sidebar: Projects */
#sidebar{width:240px;background:var(--s1);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
#sidebar h2{padding:12px 16px;font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--t2);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
#sidebar h2 button{background:var(--accent);color:#fff;border:none;border-radius:4px;padding:2px 8px;font-size:.7rem;cursor:pointer;font-family:inherit}
#project-list{flex:1;overflow-y:auto}
.proj{padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--border);transition:.15s}
.proj:hover{background:var(--s2)}
.proj.active{background:var(--s2);border-left:3px solid var(--accent)}
.proj .pname{font-size:.8rem;color:var(--t1)}
.proj .pstatus{font-size:.65rem;color:var(--t2);margin-top:2px}
/* Content area */
#content{flex:1;display:flex;overflow:hidden}
/* Phase sidebar */
#phase-panel{width:220px;background:var(--s1);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column}
#phase-panel h2{padding:12px 16px;font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--t2);border-bottom:1px solid var(--border)}
.phase{display:flex;align-items:center;gap:8px;padding:8px 16px;font-size:.75rem;cursor:pointer;transition:.15s;border-left:3px solid transparent}
.phase:hover{background:var(--s2)}
.phase.active{background:var(--s2);border-left-color:var(--accent)}
.phase.done{border-left-color:var(--green)}
.phase.error{border-left-color:var(--red)}
.phase.pending{border-left-color:var(--t2);opacity:.5}
.phase.review{border-left-color:var(--yellow)}
.phase .num{width:20px;height:20px;border-radius:50%;background:var(--s3);display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700;flex-shrink:0}
.phase.done .num{background:var(--green);color:#000}
.phase.active .num{background:var(--accent);color:#fff}
.phase.error .num{background:var(--red);color:#fff}
.phase.review .num{background:var(--yellow);color:#000}
/* Chat / Agent log */
#agent-log{flex:1;display:flex;flex-direction:column;overflow:hidden}
#log-messages{flex:1;overflow-y:auto;padding:16px 20px}
.msg{margin-bottom:8px;animation:fadeIn .15s}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.msg .mh{display:flex;align-items:center;gap:6px;margin-bottom:2px;font-size:.6rem;text-transform:uppercase;letter-spacing:.5px}
.msg.agent .mh{color:var(--accent)}
.msg.tool .mh{color:var(--yellow)}
.msg.system .mh{color:var(--cyan)}
.msg.user .mh{color:var(--blue)}
.msg.error .mh{color:var(--red)}
.msg.phase .mh{color:var(--purple)}
.msg .mb{padding:8px 12px;background:var(--s2);border-radius:6px;font-size:.78rem;line-height:1.5;white-space:pre-wrap;max-width:95%;overflow-x:auto}
.msg.phase .mb{border-left:3px solid var(--purple)}
.msg.phase.done .mb{border-left-color:var(--green)}
.msg.user .mb{background:var(--accent);color:#fff}
/* Collapsible tool call */
.tool-call{margin:4px 0 4px 0;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--s1)}
.tool-header{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--s3);cursor:pointer;font-size:.7rem;color:var(--yellow);user-select:none}
.tool-header:hover{background:var(--s2)}
.tool-header .arrow{transition:transform .2s;font-size:.6rem}
.tool-header.open .arrow{transform:rotate(90deg)}
.tool-body{padding:8px 10px;display:none;font-size:.72rem;line-height:1.4;color:var(--t2)}
.tool-body.open{display:block}
.tool-body .label{color:var(--t1);font-weight:600;margin-top:4px}
.tool-body code{background:var(--s3);padding:1px 4px;border-radius:3px;font-size:.7rem}
/* Input bar */
#inputbar{padding:10px 16px;background:var(--s1);border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0}
#inputbar input{flex:1;background:var(--s2);border:1px solid var(--border);border-radius:6px;padding:8px 12px;color:var(--t1);font-size:.8rem;font-family:inherit;outline:none}
#inputbar input:focus{border-color:var(--accent)}
#inputbar button{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:0 16px;font-size:.8rem;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
#inputbar button:hover{opacity:.9}
#inputbar button:disabled{opacity:.4;cursor:not-allowed}
#inputbar .stop-btn{background:var(--red)}
/* Empty state */
.empty{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--t2);font-size:.8rem;padding:40px}
.empty .icon{font-size:2rem;opacity:.3}
/* Phase detail */
#phase-detail{width:360px;background:var(--s1);border-left:1px solid var(--border);overflow-y:auto;flex-shrink:0;padding:16px}
#phase-detail h3{font-size:.8rem;color:var(--t1);margin-bottom:8px}
#phase-detail .section{margin-bottom:12px}
#phase-detail .section-title{font-size:.7rem;color:var(--t2);text-transform:uppercase;margin-bottom:4px}
#phase-detail .section-content{font-size:.75rem;line-height:1.5;color:var(--t1);white-space:pre-wrap;background:var(--s2);padding:8px;border-radius:6px;max-height:300px;overflow-y:auto}
#phase-detail .btn{padding:4px 10px;border-radius:4px;border:1px solid var(--border);background:var(--s3);color:var(--t1);font-size:.7rem;cursor:pointer;font-family:inherit;margin-right:4px;margin-top:4px}
#phase-detail .btn:hover{background:var(--s2)}
#phase-detail .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.hidden{display:none !important}
</style>
</head>
<body>
<div id="topbar">
  <h1>PAPERFACTORY</h1>
  <div class="nav">
    <button class="active" onclick="showView('research')">研究</button>
    <button onclick="showView('projects')">项目</button>
  </div>
  <div class="status">
    <span id="status-text">就绪</span>
    <div class="dot" id="status-dot"></div>
  </div>
</div>
<div id="main">
  <div id="sidebar">
    <h2>研究项目 <button onclick="newProject()">+ 新建</button></h2>
    <div id="project-list"></div>
  </div>
  <div id="content">
    <div id="phase-panel">
      <h2>研究流程</h2>
      <div class="phase pending" data-phase="literature_search" onclick="selectPhase(this)"><div class="num">1</div><div>文献调研</div></div>
      <div class="phase pending" data-phase="gap_identification" onclick="selectPhase(this)"><div class="num">2</div><div>识别研究空白</div></div>
      <div class="phase pending" data-phase="hypothesis_generation" onclick="selectPhase(this)"><div class="num">3</div><div>提出假设</div></div>
      <div class="phase pending" data-phase="experiment_design" onclick="selectPhase(this)"><div class="num">4</div><div>实验设计</div></div>
      <div class="phase pending" data-phase="experiment_execution" onclick="selectPhase(this)"><div class="num">5</div><div>执行实验</div></div>
      <div class="phase pending" data-phase="evidence_assessment" onclick="selectPhase(this)"><div class="num">6</div><div>证据评估</div></div>
      <div class="phase pending" data-phase="confirmation" onclick="selectPhase(this)"><div class="num">7</div><div>确认结论</div></div>
      <div class="phase pending" data-phase="report_generation" onclick="selectPhase(this)"><div class="num">8</div><div>报告生成</div></div>
    </div>
    <div id="agent-log">
      <div id="log-messages">
        <div class="empty"><div class="icon">🔬</div><div>选择或新建一个研究项目开始</div></div>
      </div>
      <div id="inputbar">
        <input id="user-input" placeholder="输入研究问题，开始研究..." />
        <button id="send-btn" onclick="startResearch()">开始研究</button>
        <button id="stop-btn" class="stop-btn hidden" onclick="stopResearch()">停止</button>
      </div>
    </div>
    <div id="phase-detail" class="hidden">
      <h3 id="detail-title">阶段详情</h3>
      <div id="detail-content"></div>
    </div>
  </div>
</div>

<script>
const logEl = document.getElementById('log-messages');
const inputEl = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
const stopBtn = document.getElementById('stop-btn');
const statusText = document.getElementById('status-text');
const statusDot = document.getElementById('status-dot');
const projectListEl = document.getElementById('project-list');
const phaseDetailEl = document.getElementById('phase-detail');
const detailContentEl = document.getElementById('detail-content');

let currentProjectId = null;
let currentRunId = null;
let isRunning = false;
let projects = [];
let phaseResults = {};

async function loadProjects() {
  try {
    const resp = await fetch('/api/projects');
    projects = await resp.json();
    renderProjects();
  } catch(e) { console.error(e); }
}

function renderProjects() {
  projectListEl.innerHTML = projects.map(p =>
    `<div class="proj${p.id === currentProjectId ? ' active' : ''}" onclick="selectProject('${p.id}')">
      <div class="pname">${esc(p.name)}</div>
      <div class="pstatus">${p.status || 'ACTIVE'} · ${new Date(p.createdAt).toLocaleDateString()}</div>
    </div>`
  ).join('');
}

async function selectProject(id) {
  currentProjectId = id;
  renderProjects();
  phaseResults = {};
  resetPhaseUI();
  clearLog();

  // Load project data
  try {
    const resp = await fetch(`/api/projects/${id}/all`);
    const data = await resp.json();

    // Show hypotheses
    if (data.hypotheses?.length) {
      addMsg('system', '假设', data.hypotheses.map(h => `  • ${h.statement} [${h.status}]`).join('\n'));
    }
    if (data.evidence?.length) {
      addMsg('system', '证据', data.evidence.map(e => `  • ${e.summary?.substring(0,100)} [${e.direction}]`).join('\n'));
    }
    if (data.citations?.length) {
      addMsg('system', '引用文献', data.citations.map(c => `  • "${c.sourceTitle}" (${c.year || '?'})`).join('\n'));
    }
    if (data.knowledge?.length) {
      addMsg('system', '知识', data.knowledge.map(k => `  • ${k.summary}`).join('\n'));
    }
  } catch(e) {}
}

async function newProject() {
  const question = inputEl.value.trim();
  if (!question) { addMsg('system', '提示', '请先输入研究问题'); return; }
  try {
    const resp = await fetch('/api/projects', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ name: question })
    });
    const proj = await resp.json();
    await loadProjects();
    selectProject(proj.id);
    inputEl.value = question;
    addMsg('system', '项目', `新建项目: ${proj.id.substring(0,8)}...`);
  } catch(e) { addMsg('error', '错误', e.message); }
}

function clearLog() {
  logEl.innerHTML = '';
}

function addMsg(type, header, content) {
  const div = document.createElement('div');
  div.className = `msg ${type}`;
  div.innerHTML = `<div class="mh">${esc(header)}</div><div class="mb">${esc(content)}</div>`;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
  return div;
}

function addToolCall(toolName, input, output) {
  const div = document.createElement('div');
  div.className = 'tool-call';
  const inputStr = JSON.stringify(input, null, 2).substring(0, 500);
  const outputStr = output?.toString?.()?.substring(0, 2000) ?? output?.substring(0, 2000) ?? '';
  div.innerHTML = `
    <div class="tool-header" onclick="this.classList.toggle('open');this.nextElementSibling.classList.toggle('open')">
      <span class="arrow">▶</span>
      <span>⚡ ${esc(toolName)}</span>
    </div>
    <div class="tool-body">
      <div class="label">输入:</div>
      <code>${esc(inputStr)}</code>
      <div class="label">输出:</div>
      <code>${esc(outputStr)}</code>
    </div>`;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}

function esc(s) { return (s ?? '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function resetPhaseUI() {
  document.querySelectorAll('.phase').forEach(el => el.className = 'phase pending');
}

function updatePhase(phaseName, status) {
  const el = document.querySelector(`.phase[data-phase="${phaseName}"]`);
  if (!el) return;
  el.className = `phase ${status}`;
}

function selectPhase(el) {
  document.querySelectorAll('.phase').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  const phaseName = el.dataset.phase;
  showPhaseDetail(phaseName);
}

function showPhaseDetail(phaseName) {
  phaseDetailEl.classList.remove('hidden');
  document.getElementById('detail-title').textContent = el?.textContent?.trim() ?? phaseName;
  const result = phaseResults[phaseName];
  let html = '';
  if (result) {
    html += `<div class="section"><div class="section-title">状态</div><div class="section-content">${result.status}</div></div>`;
    if (result.rawOutput) {
      html += `<div class="section"><div class="section-title">Agent 输出</div><div class="section-content">${esc(result.rawOutput?.substring(0, 3000))}</div></div>`;
    }
    if (result.toolCalls?.length) {
      html += `<div class="section"><div class="section-title">工具调用 (${result.toolCalls.length} 次)</div>`;
      for (const tc of result.toolCalls) {
        html += `<div class="tool-call" style="margin-bottom:4px"><div class="tool-header" onclick="this.classList.toggle('open');this.nextElementSibling.classList.toggle('open')"><span class="arrow">▶</span><span>⚡ ${esc(tc.toolName)}</span></div><div class="tool-body"><div class="label">输入</div><code>${esc(JSON.stringify(tc.input)?.substring(0,500))}</code><div class="label">输出</div><code>${esc(tc.output?.substring(0,1000))}</code></div></div>`;
      }
      html += `</div>`;
    }
    html += `<button class="btn primary" onclick="rerunPhase('${phaseName}')">重跑此阶段</button>`;
  } else {
    html = '<div style="color:var(--t2);font-size:.75rem">此阶段尚未执行</div>';
  }
  detailContentEl.innerHTML = html;
}

async function rerunPhase(phaseName) {
  if (!currentProjectId) return;
  addMsg('system', '重跑', `正在重跑阶段: ${phaseName}...`);
  updatePhase(phaseName, 'active');
  try {
    const question = inputEl.value || projects.find(p => p.id === currentProjectId)?.name || '';
    const resp = await fetch(`/api/projects/${currentProjectId}/phases/${phaseName}/run`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ question })
    });
    const result = await resp.json();
    phaseResults[phaseName] = result;
    updatePhase(phaseName, result.status === 'COMPLETED' ? 'done' : 'error');
    addMsg('system', '重跑完成', `${phaseName}: ${result.status}`);
    showPhaseDetail(phaseName);
  } catch(e) {
    addMsg('error', '错误', e.message);
    updatePhase(phaseName, 'error');
  }
}

async function startResearch() {
  const question = inputEl.value.trim();
  if (!question) return;
  if (isRunning) return;
  isRunning = true;

  addMsg('user', '你', question);
  inputEl.value = '';
  statusText.textContent = '研究中';
  statusDot.className = 'dot running';
  sendBtn.disabled = true;
  stopBtn.classList.remove('hidden');

  resetPhaseUI();
  phaseResults = {};

  addMsg('system', '系统', `启动 Agent 研究流程\n研究问题: ${question}`);

  // Create project if needed
  if (!currentProjectId) {
    try {
      const resp = await fetch('/api/projects', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ name: question })
      });
      const proj = await resp.json();
      currentProjectId = proj.id;
      await loadProjects();
    } catch(e) {}
  }

  try {
    const resp = await fetch('/api/research/stream', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ question })
    });

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (!line.trim()) continue;
        const parts = line.split('\ndata: ');
        if (parts.length < 2) continue;
        const eventType = parts[0].replace('event: ', '');
        const data = JSON.parse(parts[1]);

        if (eventType === 'run:start') {
          currentRunId = data.runId;
          if (data.projectId) currentProjectId = data.projectId;
          addMsg('system', '研究启动', `ID: ${String(data.runId).substring(0,8)}...`);
        }
        else if (eventType === 'phase:start') {
          updatePhase(data.phase, 'active');
          addMsg('phase', '阶段', `▶ ${data.content}`);
        }
        else if (eventType === 'phase:complete') {
          updatePhase(data.phase, 'done');
          addMsg('phase', '阶段', `✓ ${data.content}`);
        }
        else if (eventType === 'phase:progress') {
          addMsg('system', '进展', data.content);
        }
        else if (eventType === 'thinking') {
          addMsg('agent', '思考', data.content);
        }
        else if (eventType === 'tool:calling') {
          addMsg('tool', '工具', `⏳ ${data.toolName}(...)`);
        }
        else if (eventType === 'tool:result') {
          // Show as collapsible
          const toolName = data.toolName;
          const toolArgs = data.toolArgs || {};
          const output = data.content || '';
          addToolCall(toolName, toolArgs, output);
        }
        else if (eventType === 'message') {
          const preview = (data.content || '').substring(0, 500);
          addMsg('agent', 'Agent', preview + (data.content && data.content.length > 500 ? '\n...(更多)' : ''));
        }
        else if (eventType === 'error') {
          addMsg('error', '错误', data.content);
          if (data.phase) updatePhase(data.phase, 'error');
        }
        else if (eventType === 'run:complete') {
          statusText.textContent = '完成';
          statusDot.className = 'dot';
          addMsg('system', '完成', `假设状态: ${data.hypothesisStatus}\n假设: ${data.hypothesisId?.substring(0,8)}...\n证据: ${data.evidenceCount} | 知识: ${data.knowledgeCount} | 报告: ${data.reportCount}`);
          if (data.projectId) {
            currentProjectId = data.projectId;
            await loadProjects();
          }
        }
        else if (eventType === 'run:error') {
          statusText.textContent = '错误';
          statusDot.className = 'dot error';
          addMsg('error', '错误', data.error);
        }
      }
    }
  } catch (err) {
    statusText.textContent = '错误';
    statusDot.className = 'dot error';
    addMsg('error', '错误', err.message);
  } finally {
    isRunning = false;
    sendBtn.disabled = false;
    stopBtn.classList.add('hidden');
  }
}

async function stopResearch() {
  if (!currentRunId) return;
  try {
    await fetch(`/api/research/${currentRunId}/stop`, { method: 'POST' });
    addMsg('system', '系统', '研究已停止');
    statusText.textContent = '已停止';
    statusDot.className = 'dot';
  } catch(e) { addMsg('error', '错误', e.message); }
  isRunning = false;
  sendBtn.disabled = false;
  stopBtn.classList.add('hidden');
}

function showView(view) {
  document.querySelectorAll('#topbar .nav button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
}

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (!isRunning) startResearch();
  }
});

// Init
loadProjects();
</script>
</body>
</html>
