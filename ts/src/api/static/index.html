<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PaperFactory — Evidence-Based Research</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a0f; --surface: #12121a; --border: #2a2a3a;
    --text: #e0e0e8; --muted: #888; --accent: #6c5ce7;
    --accent-hover: #7c6ef7; --success: #00b894; --error: #e17055;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
  }
  .container { max-width: 900px; margin: 0 auto; padding: 20px; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 0; border-bottom: 1px solid var(--border); margin-bottom: 24px;
  }
  header h1 { font-size: 1.4rem; font-weight: 700; }
  header h1 span { color: var(--accent); }
  .status { font-size: 0.8rem; color: var(--muted); }
  .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .status .dot.green { background: var(--success); }
  .tab-bar { display: flex; gap: 4px; margin-bottom: 24px; }
  .tab {
    padding: 8px 16px; border-radius: 8px; cursor: pointer;
    font-size: 0.9rem; color: var(--muted); transition: all 0.15s;
    border: 1px solid transparent; background: none;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); background: var(--surface); border-color: var(--border); }
  .panel { display: none; }
  .panel.active { display: block; }
  .input-group { margin-bottom: 16px; }
  .input-group label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
  input[type="text"], textarea {
    width: 100%; padding: 10px 14px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-size: 0.95rem; outline: none; transition: border 0.15s;
  }
  input[type="text"]:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 80px; font-family: inherit; }
  button.primary {
    padding: 10px 24px; background: var(--accent); color: #fff;
    border: none; border-radius: 8px; font-size: 0.95rem;
    cursor: pointer; font-weight: 600; transition: background 0.15s;
  }
  button.primary:hover { background: var(--accent-hover); }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary {
    padding: 8px 16px; background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 0.85rem; cursor: pointer; transition: border 0.15s;
  }
  button.secondary:hover { border-color: var(--accent); }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; margin-bottom: 12px;
  }
  .card h3 { font-size: 0.95rem; margin-bottom: 6px; }
  .card .meta { font-size: 0.8rem; color: var(--muted); }
  .card .status-badge {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-size: 0.75rem; font-weight: 600;
  }
  .badge-active { background: #00b89422; color: var(--success); }
  .badge-archived { background: #e1705522; color: var(--error); }
  .result-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; margin-top: 16px;
    white-space: pre-wrap; line-height: 1.6; font-size: 0.9rem;
  }
  .result-box .loading { color: var(--muted); font-style: italic; }
  .empty { text-align: center; padding: 40px; color: var(--muted); }
  .flex-between { display: flex; justify-content: space-between; align-items: center; }
  #toast {
    position: fixed; bottom: 20px; right: 20px; padding: 10px 18px;
    background: var(--accent); color: #fff; border-radius: 8px;
    font-size: 0.85rem; opacity: 0; transition: opacity 0.3s;
    pointer-events: none; z-index: 99;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1><span>Paper</span>Factory</h1>
    <div class="status"><span class="dot green"></span>Connected</div>
  </header>

  <div class="tab-bar">
    <button class="tab active" onclick="switchTab('research')">Research</button>
    <button class="tab" onclick="switchTab('projects')">Projects</button>
  </div>

  <div id="research-panel" class="panel active">
    <div class="input-group">
      <label>Research Question</label>
      <textarea id="question" placeholder="What causes quantum entanglement? What are the latest findings on CRISPR gene therapy?"></textarea>
    </div>
    <div class="input-group">
      <label>Domain (optional)</label>
      <input type="text" id="domain" placeholder="general, medical, physics...">
    </div>
    <button class="primary" id="btn-research" onclick="startResearch()">Start Research</button>
    <div id="research-result" class="result-box" style="display:none"></div>
  </div>

  <div id="projects-panel" class="panel">
    <div class="flex-between" style="margin-bottom:16px">
      <div class="input-group" style="margin:0; flex:1; margin-right:12px">
        <input type="text" id="new-project-name" placeholder="New project name...">
      </div>
      <button class="secondary" onclick="createProject()">+ New</button>
    </div>
    <div id="project-list"></div>
  </div>
</div>

<div id="toast"></div>

<script>
const API = '';

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById(name + '-panel').classList.add('active');
  if (name === 'projects') loadProjects();
}

async function startResearch() {
  const question = document.getElementById('question').value.trim();
  if (!question) return;

  const btn = document.getElementById('btn-research');
  const result = document.getElementById('research-result');
  btn.disabled = true;
  btn.textContent = 'Researching...';
  result.style.display = 'block';
  result.innerHTML = '<span class="loading">Running research pipeline... this may take a moment.</span>';

  try {
    const res = await fetch(API + '/api/agent/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: question })
    });
    const data = await res.json();
    result.innerHTML = formatResult(data.result || 'No result returned.');
  } catch (err) {
    result.innerHTML = '<span style="color:var(--error)">Error: ' + escapeHtml(String(err)) + '</span>';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Start Research';
  }
}

function formatResult(text) {
  return escapeHtml(text).replace(/\n/g, '<br>');
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

async function createProject() {
  const name = document.getElementById('new-project-name').value.trim();
  if (!name) return;

  try {
    await fetch(API + '/api/projects', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name })
    });
    document.getElementById('new-project-name').value = '';
    toast('Project created');
    loadProjects();
  } catch (err) {
    toast('Failed to create project');
  }
}

async function loadProjects() {
  const list = document.getElementById('project-list');
  list.innerHTML = '<div class="empty">Loading...</div>';

  try {
    const res = await fetch(API + '/api/projects');
    const projects = await res.json();
    if (!projects.length) {
      list.innerHTML = '<div class="empty">No projects yet. Create one above.</div>';
      return;
    }
    list.innerHTML = projects.map(p => `
      <div class="card">
        <div class="flex-between">
          <h3>${escapeHtml(p.name)}</h3>
          <span class="status-badge ${p.status === 'ACTIVE' ? 'badge-active' : 'badge-archived'}">${p.status}</span>
        </div>
        <div class="meta">ID: ${p.id} &nbsp;·&nbsp; Created: ${new Date(p.createdAt).toLocaleString()}</div>
      </div>
    `).join('');
  } catch (err) {
    list.innerHTML = '<div class="empty" style="color:var(--error)">Failed to load projects</div>';
  }
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
</script>
</body>
</html>
