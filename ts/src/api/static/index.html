<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PaperFactory Agent</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0c10;--s1:#12151c;--s2:#1a1e28;--s3:#242836;--border:#2e3348;--t1:#e2e6ef;--t2:#6b7280;--accent:#7c5cfc;--green:#10b981;--red:#ef4444;--yellow:#f59e0b;--blue:#3b82f6;--purple:#8b5cf6;--cyan:#06b6d4}
body{font-family:'JetBrains Mono','SF Mono',Consolas,monospace;background:var(--bg);color:var(--t1);height:100vh;display:flex;flex-direction:column;overflow:hidden}
#topbar{height:48px;background:var(--s1);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0}
#topbar h1{font-size:.9rem;font-weight:700;color:var(--accent)}
#topbar .status{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:.75rem;color:var(--t2)}
#topbar .dot{width:8px;height:8px;border-radius:50%;background:var(--t2)}
#topbar .dot.running{background:var(--green);animation:pulse 1s infinite}
#topbar .dot.error{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
#main{flex:1;display:flex;overflow:hidden}
#sidebar{width:260px;background:var(--s1);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
#sidebar h2{padding:16px;font-size:.75rem;text-transform:uppercase;letter-spacing:1px;color:var(--t2);border-bottom:1px solid var(--border)}
.phase{display:flex;align-items:center;gap:10px;padding:12px 16px;border-left:3px solid transparent;transition:.2s}
.phase:hover{background:var(--s2)}
.phase.active{background:var(--s2);border-left-color:var(--accent)}
.phase.done{border-left-color:var(--green)}
.phase.error{border-left-color:var(--red)}
.phase .num{width:24px;height:24px;border-radius:50%;background:var(--s3);display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;flex-shrink:0}
.phase.done .num{background:var(--green);color:#000}
.phase.active .num{background:var(--accent);color:#fff}
.phase.error .num{background:var(--red);color:#fff}
.phase .pname{font-size:.8rem;color:var(--t1)}
.phase .pdesc{font-size:.65rem;color:var(--t2);margin-top:2px}
#chat{flex:1;display:flex;flex-direction:column;overflow:hidden}
#messages{flex:1;overflow-y:auto;padding:16px 20px}
.msg{margin-bottom:12px;animation:fadeIn .15s}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg .mh{display:flex;align-items:center;gap:6px;margin-bottom:3px;font-size:.65rem;text-transform:uppercase;letter-spacing:.5px}
.msg.agent .mh{color:var(--accent)}
.msg.tool .mh{color:var(--yellow)}
.msg.system .mh{color:var(--cyan)}
.msg.user .mh{color:var(--blue)}
.msg.error .mh{color:var(--red)}
.msg.phase .mh{color:var(--purple)}
.msg .mb{padding:10px 14px;background:var(--s2);border-radius:8px;font-size:.8rem;line-height:1.6;white-space:pre-wrap;max-width:90%;overflow-x:auto}
.msg.tool .mb{background:var(--s1);border:1px solid var(--border);font-size:.75rem}
.msg.phase .mb{border-left:3px solid var(--purple)}
.msg.phase.done .mb{border-left-color:var(--green)}
.msg.user .mb{background:var(--accent);color:#fff}
#inputbar{padding:12px 16px;background:var(--s1);border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0}
#inputbar input{flex:1;background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--t1);font-size:.85rem;font-family:inherit;outline:none}
#inputbar input:focus{border-color:var(--accent)}
#inputbar button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:0 20px;font-size:.85rem;font-weight:600;cursor:pointer;font-family:inherit}
#inputbar button:hover{opacity:.9}
#inputbar button:disabled{opacity:.5;cursor:not-allowed}
#inputbar .stop-btn{background:var(--red)}
.btn-row{display:flex;gap:8px;margin-top:8px}
.btn{padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:var(--s3);color:var(--t1);font-size:.75rem;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--s2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
#new-research{padding:16px;border-bottom:1px solid var(--border)}
#new-research input{width:100%;background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--t1);font-size:.85rem;font-family:inherit;outline:none}
#new-research input:focus{border-color:var(--accent)}
#new-research .hint{font-size:.7rem;color:var(--t2);margin-top:6px}
.hidden{display:none !important}
</style>
</head>
<body>
<div id="topbar">
  <h1>PAPERFACTORY AGENT</h1>
  <div class="status">
    <span id="status-text">就绪</span>
    <div class="dot" id="status-dot"></div>
  </div>
</div>
<div id="main">
  <div id="sidebar">
    <h2>研究流程</h2>
    <div class="phase" id="ph-literature_search"><div class="num">1</div><div><div class="pname">文献搜索</div><div class="pdesc">搜索学术文献，综合分析报告</div></div></div>
    <div class="phase" id="ph-experiment_design"><div class="num">2</div><div><div class="pname">实验设计</div><div class="pdesc">设计实验方案，编写实验代码</div></div></div>
    <div class="phase" id="ph-evidence_collection"><div class="num">3</div><div><div class="pname">证据收集</div><div class="pdesc">执行实验，收集并评估证据</div></div></div>
    <div class="phase" id="ph-hypothesis_assessment"><div class="num">4</div><div><div class="pname">假设评估</div><div class="pdesc">基于证据评估假设</div></div></div>
    <div class="phase" id="ph-confirmation"><div class="num">5</div><div><div class="pname">确认结论</div><div class="pdesc">做出最终判断</div></div></div>
    <div class="phase" id="ph-report_generation"><div class="num">6</div><div><div class="pname">报告生成</div><div class="pdesc">撰写研究报告</div></div></div>
  </div>
  <div id="chat">
    <div id="messages">
      <div class="msg system"><div class="mh">SYSTEM</div><div class="mb">PaperFactory Agent 就绪。在下方输入研究问题开始全流程研究。</div></div>
    </div>
    <div id="inputbar">
      <input id="user-input" placeholder="输入研究问题..." />
      <button id="send-btn" class="primary">开始研究</button>
      <button id="stop-btn" class="stop-btn hidden">停止</button>
    </div>
  </div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
const stopBtn = document.getElementById('stop-btn');
const statusText = document.getElementById('status-text');
const statusDot = document.getElementById('status-dot');

let currentRunId = null;
let isRunning = false;

const phaseOrder = ['literature_search','experiment_design','evidence_collection','hypothesis_assessment','confirmation','report_generation'];

function addMsg(type, header, content, extraClass) {
  const div = document.createElement('div');
  div.className = `msg ${type}${extraClass ? ' ' + extraClass : ''}`;
  div.innerHTML = `<div class="mh">${header}</div><div class="mb">${escapeHtml(content)}</div>`;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function updatePhase(phaseName, status) {
  const el = document.getElementById('ph-' + phaseName);
  if (!el) return;
  el.className = 'phase ' + status;
}

function setStatus(text, dotClass) {
  statusText.textContent = text;
  statusDot.className = 'dot' + (dotClass ? ' ' + dotClass : '');
}

async function startResearch(question) {
  if (!question.trim()) return;
  if (isRunning) return;
  isRunning = true;

  addMsg('user', 'YOU', question);
  inputEl.value = '';
  setStatus('研究中', 'running');
  sendBtn.disabled = true;
  stopBtn.classList.remove('hidden');

  // Reset phases
  phaseOrder.forEach(p => updatePhase(p, ''));

  addMsg('system', 'SYSTEM', `正在启动 Agent 研究流程...\n研究问题: ${question}`);

  try {
    const resp = await fetch('/api/research/stream', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ question })
    });

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const lines = buffer.split('\n\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (!line.trim()) continue;
        const parts = line.split('\ndata: ');
        if (parts.length < 2) continue;
        const eventType = parts[0].replace('event: ', '');
        const data = JSON.parse(parts[1]);

        if (eventType === 'run:start') {
          currentRunId = data.runId;
          addMsg('system', 'RUN START', `研究 ID: ${data.runId.substring(0, 8)}...`);
        }
        else if (eventType === 'phase:start') {
          updatePhase(data.phase, 'active');
          addMsg('phase', 'PHASE', `▶ ${data.content}`);
        }
        else if (eventType === 'phase:complete') {
          updatePhase(data.phase, 'done');
          addMsg('phase', 'PHASE', `✓ ${data.content}`);
        }
        else if (eventType === 'thinking') {
          addMsg('agent', 'AGENT 思考', data.content);
        }
        else if (eventType === 'tool:calling') {
          addMsg('tool', 'TOOL 调用', `${data.toolName}(${JSON.stringify(data.toolArgs || {})})`);
        }
        else if (eventType === 'tool:result') {
          const preview = (data.content || '').substring(0, 300);
          addMsg('tool', 'TOOL 结果', preview + (data.content && data.content.length > 300 ? '...' : ''));
        }
        else if (eventType === 'message') {
          addMsg('agent', 'AGENT', data.content);
        }
        else if (eventType === 'error') {
          addMsg('error', 'ERROR', data.content);
          if (data.phase) updatePhase(data.phase, 'error');
        }
        else if (eventType === 'run:complete') {
          setStatus('完成', '');
          addMsg('system', 'COMPLETE', `研究完成!\n假设状态: ${data.hypothesisStatus}\n证据: ${data.evidenceCount} | 知识: ${data.knowledgeCount} | 报告: ${data.reportCount}`);
        }
        else if (eventType === 'run:error') {
          setStatus('错误', 'error');
          addMsg('error', 'ERROR', data.error);
        }
      }
    }
  } catch (err) {
    setStatus('错误', 'error');
    addMsg('error', 'ERROR', err.message);
  } finally {
    isRunning = false;
    sendBtn.disabled = false;
    stopBtn.classList.add('hidden');
  }
}

async function stopResearch() {
  if (!currentRunId) return;
  try {
    await fetch(`/api/research/${currentRunId}/stop`, { method: 'POST' });
    addMsg('system', 'SYSTEM', '研究已停止');
    setStatus('已停止', '');
    isRunning = false;
    sendBtn.disabled = false;
    stopBtn.classList.add('hidden');
  } catch (err) {
    addMsg('error', 'ERROR', err.message);
  }
}

sendBtn.addEventListener('click', () => {
  startResearch(inputEl.value);
});

stopBtn.addEventListener('click', stopResearch);

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    if (isRunning) {
      addMsg('user', 'YOU', inputEl.value);
      inputEl.value = '';
    } else {
      startResearch(inputEl.value);
    }
  }
});
</script>
</body>
</html>
